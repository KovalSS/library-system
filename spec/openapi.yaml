  /loans:
    post:
      tags: [Loans]
      operationId: createLoan
      summary: Оформити видачу екземпляра читачу
      description: |
        Термін користування визначається чергою на видання на момент видачі:
        14 днів, якщо черга є, інакше 30 (REQ-F-019). Ставка штрафу (1% чи
        5% ціни за день) фіксується в тій самій умові й надалі не змінюється
        (REQ-F-027). Екземпляр, що не в стані `available`, або екземпляр,
        утримуваний за бронюванням іншого читача (бронювання в стані `ready`),
        — `409 copy_not_available`.
      x-req-ids: [REQ-F-018, REQ-F-019, REQ-F-027]
      x-roles: [librarian]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoanCreate' }
            example:
              readerId: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01
              copyId: 2c8d6f3a-5b1e-4a77-9c20-7e1f0a9b8c01
      responses:
        '201':
          description: Видачу оформлено, екземпляр отримав стан `issued`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
              example:
                id: 0d9b7a0e-7a63-4d1f-8f43-1a2b3c4d5e01
                readerId: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01
                copyId: 2c8d6f3a-5b1e-4a77-9c20-7e1f0a9b8c01
                editionId: 8a1e4b2c-3d5f-4c60-8b7a-9e0f1d2c3b01
                issuedAt: '2026-10-22'
                dueDate: '2026-11-21'
                termDays: 30
                status: active
                returnedAt: null
                overdueDays: 0
                fineRatePercent: 1
                fineAmount: 0
                finePaidAmount: 0
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CopyNotAvailable' }

  /loans/{loanId}:
    parameters:
      - $ref: '#/components/parameters/LoanId'
    get:
      tags: [Loans]
      operationId: getLoan
      summary: Картка видачі
      description: |
        Штраф обчислюється на льоту за поточною датою (REQ-F-027), не
        перевищує ціни книги (REQ-F-028); при досягненні межі статус
        автоматично стає `compensated` (REQ-F-029).
      x-req-ids: [REQ-F-021, REQ-F-027, REQ-F-028, REQ-F-029]
      x-roles: [reader, librarian, admin, chief_admin]
      responses:
        '200':
          description: Видача.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
              example:
                id: 0d9b7a0e-7a63-4d1f-8f43-1a2b3c4d5e03
                readerId: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a02
                copyId: 2c8d6f3a-5b1e-4a77-9c20-7e1f0a9b8c02
                editionId: 8a1e4b2c-3d5f-4c60-8b7a-9e0f1d2c3b04
                issuedAt: '2026-08-20'
                dueDate: '2026-09-03'
                termDays: 14
                status: compensated
                returnedAt: null
                overdueDays: 49
                fineRatePercent: 5
                fineAmount: 200
                finePaidAmount: 0
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /loans/{loanId}/return:
    parameters:
      - $ref: '#/components/parameters/LoanId'
    post:
      tags: [Loans]
      operationId: returnLoan
      summary: Оформити повернення екземпляра
      description: |
        Екземпляр стає `available` або передається першому в черзі
        (бронювання переходить у стан `ready`, REQ-F-026). Якщо було
        прострочення, у відповіді фіксується нарахований штраф. Видача, що
        вже повернута чи позначена `compensated`, — `409`.
      x-req-ids: [REQ-F-020, REQ-F-026, REQ-F-027, REQ-F-028]
      x-roles: [librarian]
      responses:
        '200':
          description: Повернення оформлено.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
              example:
                id: 0d9b7a0e-7a63-4d1f-8f43-1a2b3c4d5e02
                readerId: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01
                copyId: 2c8d6f3a-5b1e-4a77-9c20-7e1f0a9b8c01
                editionId: 8a1e4b2c-3d5f-4c60-8b7a-9e0f1d2c3b01
                issuedAt: '2026-09-15'
                dueDate: '2026-09-29'
                termDays: 14
                status: returned
                returnedAt: '2026-10-02'
                overdueDays: 3
                fineRatePercent: 5
                fineAmount: 45
                finePaidAmount: 0
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LoanStateConflict' }

  # -------------------------------------------------------- Reservations
  /reservations:
    post:
      tags: [Reservations]
      operationId: createReservation
      summary: Забронювати видання
      description: |
        Якщо є доступний екземпляр — резервується на 2 дні (стан `ready`,
        заповнено `pickupDeadline`). Якщо всі екземпляри видано — читач
        стає в чергу (стан `queued`, заповнено `queuePosition`).
        Створювати бронювання може лише читач для себе.
      x-req-ids: [REQ-F-023, REQ-F-024]
      x-roles: [reader]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationCreate' }
            example: { editionId: 8a1e4b2c-3d5f-4c60-8b7a-9e0f1d2c3b02 }
      responses:
        '201':
          description: Бронювання створено (резервація або місце в черзі).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
              examples:
                ready:
                  summary: Є доступний екземпляр
                  value:
                    id: 4e2a9c10-1b3d-4f58-a6c7-5d8e9f0a1b02
                    readerId: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01
                    editionId: 8a1e4b2c-3d5f-4c60-8b7a-9e0f1d2c3b02
                    status: ready
                    queuePosition: null
                    pickupDeadline: '2026-10-24T10:00:00Z'
                    createdAt: '2026-10-22T10:00:00Z'
                queued:
                  summary: Усі екземпляри видано
                  value:
                    id: 4e2a9c10-1b3d-4f58-a6c7-5d8e9f0a1b01
                    readerId: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01
                    editionId: 8a1e4b2c-3d5f-4c60-8b7a-9e0f1d2c3b05
                    status: queued
                    queuePosition: 2
                    pickupDeadline: null
                    createdAt: '2026-10-22T10:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------- Reports
  /reports/top-editions:
    get:
      tags: [Reports]
      operationId: getTopEditionsReport
      summary: Звіт «Топ найпопулярніших видань»
      description: |
        Видання, відсортовані за кількістю видач у періоді. CSV-експорт —
        заголовок `Accept: text/csv`, дані ті самі, що в JSON (REQ-F-042).
        Якщо `from` пізніше за `to` — `400 validation_failed`.
      x-req-ids: [REQ-F-039, REQ-F-042]
      x-roles: [librarian, admin, chief_admin]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: Звіт.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopEditionsReport' }
              example:
                from: '2026-09-01'
                to: '2026-09-30'
                generatedAt: '2026-10-22T12:00:00Z'
                items:
                  - { editionId: 8a1e4b2c-3d5f-4c60-8b7a-9e0f1d2c3b01, title: Кобзар, author: Тарас Шевченко, loansCount: 17 }
            text/csv:
              schema: { type: string }
              example: "editionId,title,author,loansCount\n8a1e4b2c-3d5f-4c60-8b7a-9e0f1d2c3b01,Кобзар,Тарас Шевченко,17\n"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/debtors:
    get:
      tags: [Reports]
      operationId: getDebtorsReport
      summary: Звіт «Читачі-боржники»
      description: |
        Читачі з простроченою видачею та/або несплаченим штрафом на момент
        формування. CSV — `Accept: text/csv`.
      x-req-ids: [REQ-F-040, REQ-F-042]
      x-roles: [librarian, admin, chief_admin]
      responses:
        '200':
          description: Звіт.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebtorsReport' }
              example:
                generatedAt: '2026-10-22T12:00:00Z'
                items:
                  - readerId: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01
                    fullName: Іван Петренко
                    email: reader@example.com
                    phone: '+380501234567'
                    overdueLoans: 1
                    outstandingFine: 45
            text/csv:
              schema: { type: string }
              example: "readerId,fullName,email,phone,overdueLoans,outstandingFine\n6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01,Іван Петренко,reader@example.com,+380501234567,1,45\n"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/library-load:
    get:
      tags: [Reports]
      operationId: getLibraryLoadReport
      summary: Звіт «Завантаженість бібліотеки»
      description: |
        Кількість видач і повернень за період. CSV — `Accept: text/csv`.
        Якщо `from` пізніше за `to` — `400 validation_failed`.
      x-req-ids: [REQ-F-041, REQ-F-042]
      x-roles: [librarian, admin, chief_admin]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Звіт.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryLoadReport' }
              example:
                from: '2026-09-01'
                to: '2026-09-30'
                generatedAt: '2026-10-22T12:00:00Z'
                issuedCount: 120
                returnedCount: 112
            text/csv:
              schema: { type: string }
              example: "from,to,issuedCount,returnedCount\n2026-09-01,2026-09-30,120,112\n"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # --------------------------------------------------------------- Audit
  /audit-log-entries:
    get:
      tags: [Audit]
      operationId: listAuditLogEntries
      summary: Аудит-лог значущих дій
      description: Хто, що саме і коли виконав. Лише адміністратори.
      x-req-ids: [REQ-F-049]
      x-roles: [admin, chief_admin]
      parameters:
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Сторінка записів журналу.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
              example:
                items:
                  - id: 9c8b7a6f-5e4d-4c3b-a291-807f6e5d4c01
                    actorId: 3a1b2c3d-4e5f-4a60-9b71-8c92d3e4f502
                    actorRole: librarian
                    action: loan.created
                    objectType: loan
                    objectId: 0d9b7a0e-7a63-4d1f-8f43-1a2b3c4d5e01
                    occurredAt: '2026-10-22T10:15:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен, отриманий через `POST /auth/login`.

  parameters:
    ReaderId:
      name: readerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EditionId:
      name: editionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CopyId:
      name: copyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LoanId:
      name: loanId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    From:
      name: from
      in: query
      required: true
      description: Початок періоду (включно).
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      required: true
      description: Кінець періоду (включно).
      schema: { type: string, format: date }

  responses:
    BadRequest:
      description: Запит не відповідає схемі (відсутні обов'язкові поля, неправильні типи чи формат).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: validation_failed
            message: Запит містить некоректні дані.
            details:
              - { field: title, issue: Обов'язкове поле. }
            requestId: req-7f3a21
    InvalidToken:
      description: Тіло некоректне або токен із листа недійсний чи прострочений.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            validation_failed:
              summary: Тіло не відповідає схемі
              value:
                code: validation_failed
                message: Запит містить некоректні дані.
                details:
                  - { field: token, issue: Обов'язкове поле. }
                requestId: req-7f3a30
            invalid_token:
              summary: Токен недійсний або прострочений
              value:
                code: invalid_token
                message: Посилання недійсне або прострочене.
                requestId: req-7f3a31
    Unauthorized:
      description: Відсутній або недійсний токен.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: unauthorized
            message: Потрібна автентифікація.
            requestId: req-7f3a22
    InvalidCredentials:
      description: Невірний email чи пароль.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: invalid_credentials
            message: Невірний email або пароль.
            requestId: req-7f3a23
    Forbidden:
      description: Роль користувача не має права на цю дію чи ресурс.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: forbidden
            message: Недостатньо прав для цієї дії.
            requestId: req-7f3a24
    AccountInactive:
      description: Акаунт деактивовано або email ще не підтверджено.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: account_inactive
            message: Акаунт неактивний.
            requestId: req-7f3a25
    AccountLocked:
      description: Акаунт заблоковано на 15 хвилин після 5 невдалих спроб входу.
      headers:
        Retry-After:
          description: Секунд до розблокування.
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: account_locked
            message: Акаунт тимчасово заблоковано на 15 хвилин.
            requestId: req-7f3a26
    ProtectedAccount:
      description: Акаунт головного адміністратора не можна змінювати (REQ-F-011), або роль не має права.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: protected_account
            message: Акаунт головного адміністратора змінювати заборонено.
            requestId: req-7f3a27
    NotFound:
      description: Ресурс не знайдено.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: not_found
            message: Ресурс не знайдено.
            requestId: req-7f3a28
    DuplicateEmail:
      description: Email уже використовується.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: duplicate_email
            message: Цей email уже використовується.
            requestId: req-7f3a29
    DuplicateIsbn:
      description: Видання з таким ISBN уже існує.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: duplicate_isbn
            message: Видання з таким ISBN уже є в каталозі.
            requestId: req-7f3a2a
    DuplicateInventoryNumber:
      description: Інвентарний номер уже існує.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: duplicate_inventory_number
            message: Екземпляр із таким інвентарним номером уже існує.
            requestId: req-7f3a2b
    CopyStateConflict:
      description: Поточний стан екземпляра не дозволяє цю операцію.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: copy_state_conflict
            message: Екземпляр виданий або списаний, зміна неможлива.
            requestId: req-7f3a2c
    CopyNotAvailable:
      description: Екземпляр не в стані `available` або утримується за бронюванням іншого читача.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: copy_not_available
            message: Екземпляр не в стані «доступний».
            requestId: req-7f3a2d
    LoanStateConflict:
      description: Видача вже завершена (повернута або компенсована).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: loan_already_closed
            message: Видача вже закрита.
            requestId: req-7f3a2e
    NoOutstandingFine:
      description: У читача немає несплаченого штрафу.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: no_outstanding_fine
            message: Несплачених штрафів немає.
            requestId: req-7f3a2f

  schemas:
    Error:
      type: object
      description: Єдина модель помилки API.
      required: [code, message]
      properties:
        code:
          type: string
          description: Машиночитний код помилки.
          enum:
            - validation_failed
            - invalid_token
            - unauthorized
            - invalid_credentials
            - forbidden
            - account_inactive
            - account_locked
            - protected_account
            - not_found
            - duplicate_email
            - duplicate_isbn
            - duplicate_inventory_number
            - copy_state_conflict
            - copy_not_available
            - loan_already_closed
            - no_outstanding_fine
        message:
          type: string
          description: Людиночитне пояснення.
        details:
          type: array
          description: Помилки окремих полів (для validation_failed).
          items:
            type: object
            required: [field, issue]
            properties:
              field: { type: string }
              issue: { type: string }
        requestId:
          type: string
          description: Ідентифікатор запиту для зіставлення із системним журналом (REQ-NF-005).

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, writeOnly: true }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, userId, role]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: Секунд до закінчення дії токена. }
        userId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
    Role:
      type: string
      enum: [reader, librarian, admin, chief_admin]
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordReset:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    EmailConfirmation:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1 }

    ReaderRegistration:
      type: object
      required: [fullName, email, phone, birthDate, password]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        phone: { type: string, pattern: '^\+?[0-9]{10,15}$' }
        birthDate: { type: string, format: date }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    Reader:
      type: object
      required: [id, fullName, email, phone, birthDate, status, registeredAt]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        birthDate: { type: string, format: date }
        status: { type: string, enum: [pending_confirmation, active] }
        registeredAt: { type: string, format: date-time }
    ReaderPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Reader' }

    Genre:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    GenreInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    EditionInput:
      type: object
      required: [author, title, year, isbn, genreId, price, totalCopies]
      properties:
        author: { type: string, minLength: 1, maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 300 }
        year: { type: integer, minimum: 1000, maximum: 2100 }
        isbn: { type: string, pattern: '^(?:[0-9]{9}[0-9X]|[0-9]{13})$', description: 'ISBN-10 (останній символ може бути X) або ISBN-13, без дефісів.' }
        genreId: { type: string, format: uuid }
        price: { type: number, minimum: 0, description: Ціна в гривнях. }
        totalCopies: { type: integer, minimum: 0 }
    EditionUpdate:
      type: object
      minProperties: 1
      properties:
        author: { type: string, minLength: 1, maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 300 }
        year: { type: integer, minimum: 1000, maximum: 2100 }
        isbn: { type: string, pattern: '^(?:[0-9]{9}[0-9X]|[0-9]{13})$' }
        genreId: { type: string, format: uuid }
        price: { type: number, minimum: 0 }
        totalCopies: { type: integer, minimum: 0 }
    Edition:
      type: object
      required: [id, author, title, year, isbn, genre, price, totalCopies, availableCopies, loansCount]
      properties:
        id: { type: string, format: uuid }
        author: { type: string }
        title: { type: string }
        year: { type: integer }
        isbn: { type: string }
        genre: { $ref: '#/components/schemas/Genre' }
        price: { type: number }
        totalCopies: { type: integer, minimum: 0 }
        availableCopies: { type: integer, minimum: 0, description: Кількість екземплярів у стані `available`. }
        loansCount: { type: integer, minimum: 0, description: Кількість видач за весь час (популярність). }
    EditionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Edition' }

    CopyStatus:
      type: string
      enum: [available, issued, damaged, written_off]
    CopyInput:
      type: object
      required: [inventoryNumber, location]
      properties:
        inventoryNumber: { type: string, minLength: 1, maxLength: 50 }
        location: { type: string, minLength: 1, maxLength: 200, description: Довільний текст. }
        status:
          type: string
          enum: [available, damaged]
          default: available
          description: Початковий стан.
    CopyUpdate:
      type: object
      minProperties: 1
      properties:
        location: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [available, damaged] }
    Copy:
      type: object
      required: [id, editionId, inventoryNumber, location, status]
      properties:
        id: { type: string, format: uuid }
        editionId: { type: string, format: uuid }
        inventoryNumber: { type: string }
        location: { type: string }
        status: { $ref: '#/components/schemas/CopyStatus' }

    AccountInput:
      type: object
      required: [fullName, email, password]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    AccountUpdate:
      type: object
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        active: { type: boolean }
    Account:
      type: object
      required: [id, fullName, email, role, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [librarian, admin, chief_admin]
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    LoanStatus:
      type: string
      description: |
        `active` — видано й не повернуто; `returned` — повернуто;
        `compensated` — «не повернуто, компенсовано повною вартістю».
      enum: [active, returned, compensated]
    LoanCreate:
      type: object
      required: [readerId, copyId]
      properties:
        readerId: { type: string, format: uuid }
        copyId: { type: string, format: uuid }
    Loan:
      type: object
      required: [id, readerId, copyId, editionId, issuedAt, dueDate, termDays, status, overdueDays, fineRatePercent, fineAmount, finePaidAmount]
      properties:
        id: { type: string, format: uuid }
        readerId: { type: string, format: uuid }
        copyId: { type: string, format: uuid }
        editionId: { type: string, format: uuid }
        issuedAt: { type: string, format: date }
        dueDate: { type: string, format: date }
        termDays: { type: integer, enum: [14, 30] }
        status: { $ref: '#/components/schemas/LoanStatus' }
        returnedAt: { type: [string, 'null'], format: date }
        overdueDays: { type: integer, minimum: 0, description: Обчислюється на льоту за поточною датою. }
        fineRatePercent:
          type: integer
          enum: [1, 5]
          description: Відсоток ціни книги за день; зафіксований на момент видачі.
        fineAmount: { type: number, minimum: 0, description: Нарахований штраф у гривнях, не більше ціни книги. }
        finePaidAmount: { type: number, minimum: 0 }
    LoanPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Loan' }

    ReservationStatus:
      type: string
      description: |
        `ready` — екземпляр утримується для читача (2 дні); `queued` — читач
        у черзі; `fulfilled` — отримано; `expired` — не отримано за 2 дні,
        скасовано автоматично.
      enum: [ready, queued, fulfilled, expired]
    ReservationCreate:
      type: object
      required: [editionId]
      properties:
        editionId: { type: string, format: uuid }
    Reservation:
      type: object
      required: [id, readerId, editionId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        readerId: { type: string, format: uuid }
        editionId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        queuePosition: { type: [integer, 'null'], minimum: 1, description: Позиція в черзі для стану `queued`. }
        pickupDeadline: { type: [string, 'null'], format: date-time, description: Строк отримання для стану `ready`. }
        createdAt: { type: string, format: date-time }
    ReservationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Reservation' }

    FineSummary:
      type: object
      required: [readerId, currency, totalOutstanding, items]
      properties:
        readerId: { type: string, format: uuid }
        currency: { type: string, enum: [UAH] }
        totalOutstanding: { type: number, minimum: 0 }
        items:
          type: array
          items:
            type: object
            required: [loanId, editionTitle, fineAmount, paidAmount, outstandingAmount]
            properties:
              loanId: { type: string, format: uuid }
              editionTitle: { type: string }
              fineAmount: { type: number, minimum: 0 }
              paidAmount: { type: number, minimum: 0 }
              outstandingAmount: { type: number, minimum: 0 }
    FinePaymentCreate:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [cash, card] }
    FinePayment:
      type: object
      required: [id, readerId, method, amount, currency, paidAt]
      properties:
        id: { type: string, format: uuid }
        readerId: { type: string, format: uuid }
        method: { type: string, enum: [cash, card] }
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, enum: [UAH] }
        paidAt: { type: string, format: date-time }

    Recommendation:
      type: object
      required: [reason, edition]
      properties:
        reason: { type: string, enum: [same_author, same_genre] }
        edition: { $ref: '#/components/schemas/Edition' }

    Notification:
      type: object
      required: [id, readerId, type, message, createdAt]
      properties:
        id: { type: string, format: uuid }
        readerId: { type: string, format: uuid }
        type: { type: string, enum: [due_soon, reservation_ready, overdue_fine] }
        message: { type: string }
        loanId: { type: string, format: uuid }
        reservationId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Notification' }

    TopEditionsReport:
      type: object
      required: [from, to, generatedAt, items]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [editionId, title, author, loansCount]
            properties:
              editionId: { type: string, format: uuid }
              title: { type: string }
              author: { type: string }
              loansCount: { type: integer, minimum: 0 }
    DebtorsReport:
      type: object
      required: [generatedAt, items]
      properties:
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [readerId, fullName, email, phone, overdueLoans, outstandingFine]
            properties:
              readerId: { type: string, format: uuid }
              fullName: { type: string }
              email: { type: string, format: email }
              phone: { type: string }
              overdueLoans: { type: integer, minimum: 0 }
              outstandingFine: { type: number, minimum: 0 }
    LibraryLoadReport:
      type: object
      required: [from, to, generatedAt, issuedCount, returnedCount]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        generatedAt: { type: string, format: date-time }
        issuedCount: { type: integer, minimum: 0 }
        returnedCount: { type: integer, minimum: 0 }

    AuditLogEntry:
      type: object
      required: [id, actorId, actorRole, action, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        actorRole: { $ref: '#/components/schemas/Role' }
        action: { type: string, description: 'Тип дії, напр. `loan.created`.' }
        objectType: { type: string }
        objectId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
    AuditLogPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AuditLogEntry' }
