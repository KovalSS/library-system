openapi: 3.1.0

info:
  title: Library System API
  version: 1.0.0
  summary: REST API бібліотечної інформаційної системи (контракт до реалізації).
  description: |
    Формальний контракт REST API, спроєктований за затвердженою `spec/srs.md`
    (лаб. №4, підхід API-first). Реалізації ще немає: контракт перевіряється
    Python-валідатором `tests/api/lint_contract.py` і mock-сервером
    `tests/api/mock_server.py`.

    **Зв'язок із вимогами.** Кожна операція має розширення `x-req-ids` — перелік
    ідентифікаторів `REQ-F-NNN` / `REQ-NF-NNN`, які вона реалізує або через які
    спостерігається поведінка. Зведена таблиця — `docs/api-design.md`.

    **Ролі.** Розширення `x-roles` вказує ролі, яким дозволена операція:
    `reader` (читач), `librarian` (бібліотекар), `admin` (адміністратор нижчого
    рівня), `chief_admin` (головний адміністратор). Головний адміністратор має
    всі права адміністратора.

    **Єдина модель помилок.** Усі відповіді 4xx мають тіло `Error`
    (`#/components/schemas/Error`).

    **Правила вибору коду помилки.**
    * `400` — запит синтаксично чи за схемою некоректний;
    * `401` — відсутня або недійсна автентифікація;
    * `403` — автентифікований користувач не має права на дію;
    * `404` — ресурс не знайдено;
    * `409` — порушення унікальності або несумісний поточний стан ресурсу;
    * `423` — акаунт тимчасово заблоковано (REQ-F-048).

    **Поведінка, якої немає в SRS**, винесена в `logs/api-addendum-1.md`.
    Самостійне продовження терміну користування (REQ-F-022) скасовано
    рішенням LS-40, тому в API відсутнє.
  contact:
    name: Команда розробки бібліотечної системи
    email: serhii.koval@datarootlabs.com
  license:
    name: Proprietary

servers:
  - url: http://127.0.0.1:4010
    description: Mock API (tests/api/mock_server.py)

tags:
  - name: Auth
    description: Автентифікація та відновлення пароля
  - name: Readers
    description: Читачі та їхній кабінет
  - name: Catalog
    description: Каталог видань, екземпляри, жанри
  - name: Accounts
    description: Облікові записи адміністраторів і бібліотекарів
  - name: Loans
    description: Видача та повернення
  - name: Reservations
    description: Бронювання та черга
  - name: Fines
    description: Штрафи
  - name: Reports
    description: Звіти
  - name: Audit
    description: Аудит-лог

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Вхід у систему
      description: |
        Після 5 поспіль невдалих спроб акаунт блокується на 15 хвилин —
        відповідь `423` із заголовком `Retry-After`.
        Деактивований акаунт і акаунт читача без підтвердженого email
        отримують `403`.
      security: []
      x-req-ids: [REQ-F-009, REQ-F-010, REQ-F-012, REQ-F-013, REQ-F-014, REQ-F-016, REQ-F-048, REQ-NF-003]
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: reader@example.com, password: S3cret-pass }
      responses:
        '200':
          description: Автентифікація успішна.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.demo.signature
                tokenType: Bearer
                expiresIn: 3600
                userId: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01
                role: reader
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/AccountInactive' }
        '423': { $ref: '#/components/responses/AccountLocked' }

  /auth/password-reset-requests:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Запросити лист для скидання пароля
      description: |
        Відповідь завжди `202`, незалежно від того, чи існує акаунт з такою
        адресою, щоб не розкривати наявність облікових записів.
      security: []
      x-req-ids: [REQ-F-047]
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
            example: { email: reader@example.com }
      responses:
        '202': { description: 'Запит прийнято; якщо акаунт існує, лист надіслано.' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/password-resets:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Встановити новий пароль за токеном із листа
      description: Токен надходить у листі, створеному за `POST /auth/password-reset-requests`; недійсний чи прострочений токен — `400 invalid_token`.
      security: []
      x-req-ids: [REQ-F-047, REQ-NF-003]
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordReset' }
            example: { token: 3b1f9d2c8e7a4c5d, newPassword: N3w-S3cret-pass }
      responses:
        '204': { description: Пароль змінено. }
        '400': { $ref: '#/components/responses/InvalidToken' }

  # ------------------------------------------------------------- Readers
  /readers:
    post:
      tags: [Readers]
      operationId: registerReader
      summary: Самостійна реєстрація читача
      description: |
        Створює акаунт читача у стані `pending_confirmation` і надсилає лист із
        посиланням підтвердження. Повторна реєстрація на email, що вже
        використовується підтвердженим акаунтом, — `409`.
      security: []
      x-req-ids: [REQ-F-015, REQ-F-017]
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReaderRegistration' }
            example:
              fullName: Іван Петренко
              email: reader@example.com
              phone: '+380501234567'
              birthDate: '1995-04-12'
              password: S3cret-pass
      responses:
        '201':
          description: Акаунт створено, очікує підтвердження email.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reader' }
              example:
                id: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01
                fullName: Іван Петренко
                email: reader@example.com
                phone: '+380501234567'
                birthDate: '1995-04-12'
                status: pending_confirmation
                registeredAt: '2026-10-20T09:15:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/DuplicateEmail' }
    get:
      tags: [Readers]
      operationId: listReaders
      summary: Пошук читачів (для персоналу)
      description: Доступний лише бібліотекарям і адміністраторам (REQ-F-050).
      x-req-ids: [REQ-F-018, REQ-F-050]
      x-roles: [librarian, admin, chief_admin]
      parameters:
        - name: q
          in: query
          description: Підрядок у ПІБ або email.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Сторінка читачів.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReaderPage' }
              example:
                items:
                  - id: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01
                    fullName: Іван Петренко
                    email: reader@example.com
                    phone: '+380501234567'
                    birthDate: '1995-04-12'
                    status: active
                    registeredAt: '2026-10-20T09:15:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /readers/{readerId}:
    parameters:
      - $ref: '#/components/parameters/ReaderId'
    get:
      tags: [Readers]
      operationId: getReader
      summary: Дані читача
      description: |
        Персональні дані бачить лише сам читач та персонал (REQ-F-050).
        Читач, що запитує чужий профіль, отримує `403`.
      x-req-ids: [REQ-F-050, REQ-NF-003]
      x-roles: [reader, librarian, admin, chief_admin]
      responses:
        '200':
          description: Профіль читача.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reader' }
              example:
                id: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01
                fullName: Іван Петренко
                email: reader@example.com
                phone: '+380501234567'
                birthDate: '1995-04-12'
                status: active
                registeredAt: '2026-10-20T09:15:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /email-confirmations:
    post:
      tags: [Readers]
      operationId: confirmReaderEmail
      summary: Підтвердити email читача за токеном із посилання
      description: |
        Посилання з листа відкриває сторінку веб-застосунку, яка надсилає
        токен сюди. Зміна стану не виконується через `GET`. Недійсний чи
        прострочений токен — `400 invalid_token`.
      security: []
      x-req-ids: [REQ-F-016]
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailConfirmation' }
            example: { token: 9a7c1e0b5d2f4a68 }
      responses:
        '200':
          description: Акаунт активовано.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reader' }
              example:
                id: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01
                fullName: Іван Петренко
                email: reader@example.com
                phone: '+380501234567'
                birthDate: '1995-04-12'
                status: active
                registeredAt: '2026-10-20T09:15:00Z'
        '400': { $ref: '#/components/responses/InvalidToken' }

  /readers/{readerId}/loans:
    parameters:
      - $ref: '#/components/parameters/ReaderId'
    get:
      tags: [Loans]
      operationId: listReaderLoans
      summary: Історія видач читача
      description: Минулі й поточні видачі з датами (кабінет читача).
      x-req-ids: [REQ-F-021, REQ-F-029]
      x-roles: [reader, librarian, admin, chief_admin]
      parameters:
        - name: status
          in: query
          description: Фільтр за статусом видачі.
          schema: { $ref: '#/components/schemas/LoanStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Сторінка видач.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanPage' }
              example:
                items:
                  - id: 0d9b7a0e-7a63-4d1f-8f43-1a2b3c4d5e01
                    readerId: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01
                    copyId: 2c8d6f3a-5b1e-4a77-9c20-7e1f0a9b8c01
                    editionId: 8a1e4b2c-3d5f-4c60-8b7a-9e0f1d2c3b01
                    issuedAt: '2026-10-01'
                    dueDate: '2026-10-31'
                    termDays: 30
                    status: active
                    returnedAt: null
                    overdueDays: 0
                    fineRatePercent: 1
                    fineAmount: 0
                    finePaidAmount: 0
                page: 1
                pageSize: 20
                total: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /readers/{readerId}/reservations:
    parameters:
      - $ref: '#/components/parameters/ReaderId'
    get:
      tags: [Reservations]
      operationId: listReaderReservations
      summary: Бронювання та позиції в черзі читача
      description: Читач бачить власні бронювання, строк отримання та позицію в черзі.
      x-req-ids: [REQ-F-023, REQ-F-024, REQ-F-025, REQ-F-026, REQ-F-036]
      x-roles: [reader, librarian, admin, chief_admin]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReservationStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Сторінка бронювань.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationPage' }
              example:
                items:
                  - id: 4e2a9c10-1b3d-4f58-a6c7-5d8e9f0a1b01
                    readerId: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01
                    editionId: 8a1e4b2c-3d5f-4c60-8b7a-9e0f1d2c3b02
                    status: queued
                    queuePosition: 2
                    pickupDeadline: null
                    createdAt: '2026-10-20T10:00:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /readers/{readerId}/fines:
    parameters:
      - $ref: '#/components/parameters/ReaderId'
    get:
      tags: [Fines]
      operationId: getReaderFines
      summary: Поточні штрафи читача
      description: |
        Суми обчислюються на льоту за поточною датою (REQ-F-027), без
        окремого фонового перерахунку; жоден штраф не перевищує ціни книги
        (REQ-F-028).
      x-req-ids: [REQ-F-027, REQ-F-028, REQ-F-031]
      x-roles: [reader, librarian, admin, chief_admin]
      responses:
        '200':
          description: Підсумок штрафів.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FineSummary' }
              example:
                readerId: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01
                currency: UAH
                totalOutstanding: 45
                items:
                  - loanId: 0d9b7a0e-7a63-4d1f-8f43-1a2b3c4d5e02
                    editionTitle: Кобзар
                    fineAmount: 45
                    paidAmount: 0
                    outstandingAmount: 45
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /readers/{readerId}/fine-payments:
    parameters:
      - $ref: '#/components/parameters/ReaderId'
    post:
      tags: [Fines]
      operationId: payReaderFines
      summary: Зареєструвати оплату штрафу
      description: |
        Бібліотекар реєструє оплату повної суми заборгованості читача
        готівкою чи карткою. Часткова оплата не підтримується, тому сума в
        запиті не передається — її визначає система. Якщо боргу немає — `409`.
      x-req-ids: [REQ-F-030]
      x-roles: [librarian]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinePaymentCreate' }
            example: { method: cash }
      responses:
        '201':
          description: Оплату зареєстровано, заборгованість обнулено.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinePayment' }
              example:
                id: 7b5c3d1e-9f2a-4e60-b8d4-0a1c2e3f4b01
                readerId: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01
                method: cash
                amount: 45
                currency: UAH
                paidAt: '2026-10-22T12:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoOutstandingFine' }

  /readers/{readerId}/recommendations:
    parameters:
      - $ref: '#/components/parameters/ReaderId'
    get:
      tags: [Readers]
      operationId: listReaderRecommendations
      summary: Рекомендації видань для читача
      description: |
        За авторами та жанрами раніше отриманих книг; лише видання, які
        мають хоча б один екземпляр у фонді на момент формування.
      x-req-ids: [REQ-F-032, REQ-F-033, REQ-F-034]
      x-roles: [reader, librarian, admin, chief_admin]
      responses:
        '200':
          description: Список рекомендацій.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Recommendation' }
              example:
                - reason: same_author
                  edition:
                    id: 8a1e4b2c-3d5f-4c60-8b7a-9e0f1d2c3b03
                    author: Тарас Шевченко
                    title: Гайдамаки
                    year: 1841
                    isbn: '9786171234567'
                    genre: { id: 1b2c3d4e-5f60-4a71-8b92-a3b4c5d6e701, name: Поезія }
                    price: 250
                    totalCopies: 3
                    availableCopies: 2
                    loansCount: 41
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /readers/{readerId}/notifications:
    parameters:
      - $ref: '#/components/parameters/ReaderId'
    get:
      tags: [Readers]
      operationId: listReaderNotifications
      summary: Сповіщення читача
      description: Повний список у хронологічному порядку (від найновіших).
      x-req-ids: [REQ-F-035, REQ-F-036, REQ-F-037, REQ-F-038]
      x-roles: [reader, librarian, admin, chief_admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Сторінка сповіщень.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
              example:
                items:
                  - id: 5d4c3b2a-1f0e-4d9c-8b7a-6a5b4c3d2e01
                    readerId: 6f0c1c52-4f43-4f6e-9a55-0c6a3d2c1a01
                    type: due_soon
                    message: Термін повернення книги «Кобзар» спливає 31.10.2026.
                    loanId: 0d9b7a0e-7a63-4d1f-8f43-1a2b3c4d5e01
                    createdAt: '2026-10-29T06:00:00Z'
                page: 1
                pageSize: 20
                total: 1
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------- Catalog
  /genres:
    get:
      tags: [Catalog]
      operationId: listGenres
      summary: Довідник жанрів
      description: Перелік жанрів доступний усім ролям, зокрема для вибору жанру бібліотекарем.
      x-req-ids: [REQ-F-001, REQ-F-003, REQ-F-046]
      x-roles: [reader, librarian, admin, chief_admin]
      responses:
        '200':
          description: Усі жанри.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Genre' }
              example:
                - { id: 1b2c3d4e-5f60-4a71-8b92-a3b4c5d6e701, name: Поезія }
                - { id: 1b2c3d4e-5f60-4a71-8b92-a3b4c5d6e702, name: Повість }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Catalog]
      operationId: createGenre
      summary: Додати жанр
      description: Новий жанр одразу доступний бібліотекарю при реєстрації видання.
      x-req-ids: [REQ-F-003]
